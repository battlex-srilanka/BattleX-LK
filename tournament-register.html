<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Registration | BattleX LK</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="tournament-register.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">BATTLE<span>X</span> LK</div>
        <nav>
            <ul>
                <li><a href="tournaments.html">Tournaments</a></li>
                <li><a href="#" class="active">Register</a></li>
            </ul>
        </nav>
        <a href="tournaments.html" class="btn-join"><i class="fa-solid fa-arrow-left"></i> Back to Tournaments</a>
    </header>

    <!-- Registration Section -->
    <section class="register-section">
        <div class="register-container">
            <div class="form-header">
                <h2>Tournament <span>Registration</span></h2>
                <p>Fill in your details below to secure your slot for the upcoming Free Fire custom match.</p>
            </div>

            <form id="regForm">
                <!-- Select Tournament -->
                <div class="input-group">
                    <label for="tournament"><i class="fa-solid fa-trophy"></i> Select Tournament</label>
                    <select id="tournament" required>
                        <option value="" disabled selected>-- Choose Your Match --</option>
                        <option value="squad-clash">BattleX Squad Clash #12 (LKR 10,000)</option>
                        <option value="solo-rampage">Solo Rampage Series (LKR 5,000)</option>
                        <option value="pro-league">Pro League Qualifier (LKR 25,000)</option>
                    </select>
                </div>

                <!-- Team Name (If Squad) -->
                <div class="input-group" id="team-name-group">
                    <label for="teamName"><i class="fa-solid fa-users"></i> Squad / Team Name</label>
                    <input type="text" id="teamName" placeholder="Enter your team name">
                </div>

                <!-- Leader / Player Name -->
                <div class="input-group">
                    <label for="playerName"><i class="fa-solid fa-user"></i> Leader / Player In-Game Name (IGN)</label>
                    <input type="text" id="playerName" placeholder="e.g. BX丨Laki" required>
                </div>

                <!-- Free Fire UID -->
                <div class="input-group">
                    <label for="ffUid"><i class="fa-solid fa-id-card"></i> Leader / Player Free Fire UID</label>
                    <input type="number" id="ffUid" placeholder="Enter your numeric UID" required>
                </div>

                <!-- Squad Members Section (Hidden for Solo) -->
                <div id="squad-members-section">
                    <h3 class="sub-heading"><i class="fa-solid fa-users-gear"></i> Other 3 Squad Members Details</h3>
                    
                    <div class="member-box">
                        <label>Member 2 Details</label>
                        <div class="member-inputs">
                            <input type="text" id="member2Name" placeholder="Player 2 IGN">
                            <input type="number" id="member2Uid" placeholder="Player 2 UID">
                        </div>
                    </div>

                    <div class="member-box">
                        <label>Member 3 Details</label>
                        <div class="member-inputs">
                            <input type="text" id="member3Name" placeholder="Player 3 IGN">
                            <input type="number" id="member3Uid" placeholder="Player 3 UID">
                        </div>
                    </div>

                    <div class="member-box">
                        <label>Member 4 Details</label>
                        <div class="member-inputs">
                            <input type="text" id="member4Name" placeholder="Player 4 IGN">
                            <input type="number" id="member4Uid" placeholder="Player 4 UID">
                        </div>
                    </div>
                </div>

                <!-- WhatsApp Number -->
                <div class="input-group">
                    <label for="whatsapp"><i class="fa-brands fa-whatsapp"></i> WhatsApp Number</label>
                    <input type="tel" id="whatsapp" placeholder="e.g. 0763810658" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Confirm Registration</button>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>BattleX Sri Lanka &copy; 2026. Created by Expergen.</p>
    </footer>

    <!-- External JavaScript -->
    <script src="tournament-register.js"></script>
</body>
</html>
