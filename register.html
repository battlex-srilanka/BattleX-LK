<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register & Login - Battex LK</title>
    <link rel="stylesheet" href="register.css">
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Home Button (මුල් පිටුවට යාමේ බටන් එක) -->
    <div class="back-home-container">
        <a href="index.html" class="back-home-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <div class="auth-container">
        <!-- Form Switch Tabs -->
        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchForm('register')">Register</button>
            <button class="tab-btn" onclick="switchForm('login')">Sign In</button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="form-box active">
            <h2>Create Account</h2>
            
            <div class="input-group">
                <label><i class="fa-solid fa-user"></i> Gamer Name</label>
                <input type="text" id="regName" placeholder="Enter your gamer name" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-id-badge"></i> Free Fire UID</label>
                <input type="text" id="regUid" placeholder="Enter your Free Fire UID" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-phone"></i> Phone Number</label>
                <input type="tel" id="regPhone" placeholder="Enter your phone number" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="regEmail" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="regPassword" placeholder="Enter your password" required>
            </div>

            <button type="button" class="submit-btn" onclick="handleSignUp()">Register</button>
        </div>

        <!-- Login Form -->
        <div id="loginForm" class="form-box">
            <h2>Welcome Back</h2>

            <div class="input-group">
                <label><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>
            </div>

            <button type="button" class="submit-btn" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <!-- Firebase & Custom Script -->
    <script type="module" src="register.js"></script>
</body>
</html>
